
<div class="page-heading">
  <div>
    <h1>Walk-in patient</h1>
    <p>Register a patient who visits the clinic without a prior appointment.</p>
  </div>
</div>

<div class="form-layout">
  <form id="bookingForm">

    <section class="form-section">
      <h3>Patient details</h3>

      <div class="form-grid">
        <div class="field">
          <label>Full name *</label>
          <input name="name" placeholder="Enter patient's full name" required />
        </div>

        <div class="field">
          <label>Phone number *</label>
          <input name="phone" type="tel" placeholder="09XX XXX XXXX" required />
        </div>

        <div class="field">
          <label>Email address</label>
          <input name="email" type="email" placeholder="patient@email.com" />
        </div>

        <div class="field">
          <label>Birth date</label>
          <input name="birth" type="date" />
        </div>

        <div class="field">
          <label>Gender</label>
          <select name="gender">
            <option value="">Select gender</option>
            <option>Female</option>
            <option>Male</option>
            <option>Prefer not to say</option>
          </select>
        </div>

        <div class="field">
          <label>Address</label>
          <input name="address" placeholder="Patient address" />
        </div>
      </div>
    </section>

    <section class="form-section">
      <h3>Appointment details</h3>

      <div class="form-grid">
        <div class="field">
          <label>Appointment date *</label>
          <input name="date" type="date" required />
        </div>

        <div class="field">
          <label>Preferred time *</label>
          <select name="time" required>
            <option value="">Select time</option>
            <option>09:00 AM</option>
            <option>10:00 AM</option>
            <option>10:30 AM</option>
            <option>11:00 AM</option>
            <option>01:00 PM</option>
            <option>02:00 PM</option>
            <option>03:00 PM</option>
          </select>
        </div>

        <div class="field">
          <label>Service *</label>
          <select name="service" required>
            <option value="">Select service</option>
            <option>Dental Cleaning</option>
            <option>Tooth Extraction</option>
            <option>Consultation</option>
            <option>Dental Filling</option>
            <option>Braces Adjustment</option>
            <option>Teeth Whitening</option>
          </select>
        </div>

        <div class="field">
          <label>Dentist *</label>
          <select name="dentist" required>
            <option value="">Select dentist</option>
            <option>Dr. Angela M.</option>
            <option>Dr. John D.</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label>Notes / concerns</label>
        <textarea name="notes" placeholder="Additional information..."></textarea>
      </div>
    </section>

    <div class="heading-actions">
      <button type="reset" class="btn btn-outline">Clear form</button>
      <button type="submit" class="btn btn-primary">Register walk-in patient</button>
    </div>

  </form>

  <aside>
    <section class="panel">
      <div class="panel-head">
        <h3>Schedule information</h3>
      </div>
      <p class="small-note">
        Select the patient's preferred date, time, service, and dentist.
        The appointment will be marked as Confirmed after successful registration.
      </p>
    </section>
  </aside>
</div>
