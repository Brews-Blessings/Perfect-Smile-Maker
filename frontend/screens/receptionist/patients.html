
<div class="page-heading">
<div>
<h1>Patient records</h1>
<p>Search and manage registered patient information.</p>
</div>
</div>
<section class="panel">
<div class="toolbar">
<input aria-label="Search by patient name or phone number..." id="patientSearch" placeholder="Search by patient name or phone number..."/>
<select aria-label="Form field" id="patientStatusFilter">
<option value="All">All</option>
<option value="Pending">Pending</option>
<option value="Confirmed">Confirmed</option>
<option value="Completed">Completed</option>
<option value="Cancelled">Cancelled</option>
<option value="No-show">No-show</option>
<option value="No Appointment">No Appointment</option>
</select>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>PATIENT NAME</th>
<th>PHONE NUMBER</th>
<th>LAST VISIT</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>
<tbody id="patientTable"></tbody>
</table>
</div>
</section>
