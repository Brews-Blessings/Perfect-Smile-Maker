<div class="page-heading">
<div>
<h1>Patient file</h1>
<p>View and update patient information.</p>
</div>
<button class="btn btn-outline" data-page="patients">← Back to records</button>
</div>
<div class="patient-file-card">
<section class="panel">
<div class="panel-head">
<h3>Patient information</h3>
<span class="role-chip" id="patientStatus">PATIENT RECORD</span>
</div>
<form id="editPatientForm">
<div class="form-grid">
<div class="field"><label for="editName">Full name *</label><input id="editName" maxlength="50" name="name" required=""/></div>
<div class="field"><label for="editBirthday">Birthday</label><input id="editBirthday" name="birthday" type="date"/></div>
<div class="field"><label for="editAddress">Address</label><input id="editAddress" maxlength="100" name="address"/></div>
<div class="field"><label for="editOccupation">Occupation</label><input id="editOccupation" maxlength="50" name="occupation"/></div>
<div class="field"><label for="editCivilStatus">Civil status</label>
<select id="editCivilStatus" name="civil_status">
<option value="">Select civil status</option><option value="Single">Single</option><option value="Married">Married</option><option value="Widowed">Widowed</option><option value="Separated">Separated</option>
</select>
</div>
<div class="field"><label for="editPhone">Phone number *</label><input id="editPhone" maxlength="20" name="phone" pattern="09[0-9]{2} ?[0-9]{3} ?[0-9]{4}" required="" title="Enter a Philippine mobile number in the format 09XX XXX XXXX." type="tel"/></div>
<div class="field"><label for="editLast">Last visit</label><input aria-readonly="true" id="editLast" readonly=""/></div>
</div>
<div class="heading-actions" style="justify-content:flex-end;margin-top:12px"><button class="btn btn-primary" type="submit">Save changes</button></div>
</form>
</section>
<section class="panel">
<div class="panel-head"><h3>Appointment history</h3></div>
<div class="table-wrap"><table>
<thead><tr><th>DATE</th><th>SERVICE</th><th>DOCTOR</th><th>STATUS</th></tr></thead>
<tbody id="patientHistory"></tbody>
</table></div>
</section>
</div>
