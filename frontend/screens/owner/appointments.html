
<div class="page-heading">
<div>
<h1>Appointments</h1>
<p>View and manage all clinic appointments.</p>
</div>
</div>
<section class="panel">
<div class="toolbar">
<input aria-label="Search patient or service..." id="appointmentSearch" placeholder="Search patient or service..."/>
<select aria-label="Form field" id="appointmentFilter">
<option value="All">All</option>
<option value="Pending">Pending</option>
<option value="Confirmed">Confirmed</option>
<option value="Completed">Completed</option>
<option value="Cancelled">Cancelled</option>
<option value="No-show">No-show</option>
</select>
<button aria-label="Filter by date" class="date-trigger" id="appointmentDateBtn" type="button">Filter by date</button><input id="appointmentDate" type="hidden"/>
</div>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>DATE</th>
<th>TIME</th>
<th>PATIENT</th>
<th>SERVICE</th>
<th>DENTIST</th>
<th>STATUS</th>
<th>ACTION</th>
</tr>
</thead>
<tbody id="appointmentTable"></tbody>
</table>
</div>
</section>
