<div class="modal-card popup-form">
<div class="modal-header">
<div><strong>Update Appointment</strong><p>View and update the appointment details and status.</p></div>
<button class="modal-close" data-close-popup="">×</button>
</div>
<form id="updateAppointmentForm">
<div class="modal-body">
<div class="modal-grid">
<div class="field"><label>Appointment Date *</label><input aria-label="date" name="date" required="" type="date"/></div>
<div class="field"><label>Appointment Time *</label><select aria-label="time" name="time" required=""><option value="">Select time</option><option>09:00 AM</option><option>10:00 AM</option><option>10:30 AM</option><option>11:00 AM</option><option>01:00 PM</option><option>02:00 PM</option><option>03:00 PM</option></select></div>
<div class="field"><label>Patient</label><input aria-label="patient" aria-readonly="true" name="patient" readonly=""/></div>
<div class="field"><label>Doctor *</label><select aria-label="doctor_id" name="doctor_id" required=""><option value="">Select doctor</option></select></div>
<div class="field"><label>Procedure *</label><select aria-label="service" name="service" required=""><option value="">Select procedure</option><option>Tooth Extraction</option><option>Dental Restoration</option><option>Pasta/Tooth Filling</option><option>Oral Prophylaxis and Cleaning</option><option>Fixed Bridge</option><option>Zirconia Crowns</option><option>Porcelain-Fused-to-Mental (PFM)</option><option>Tightlights</option><option>Wisdom Tooth Removal</option><option>Impacted Tooth Removal</option><option>Braces Installations / Orthodontic Services</option></select></div>
<div class="field"><label>Booking Type</label><input aria-label="booking_type" aria-readonly="true" name="booking_type" readonly=""/></div>
<div class="field modal-full"><label>Appointment Status *</label><select aria-label="status" name="status"></select></div>
</div>
<p class="small-note">Only allowed status changes can be saved.</p>
</div>
<div class="modal-footer"><button class="btn btn-outline" data-close-popup="" type="button">Cancel</button><button class="btn btn-primary" type="submit">Save Changes</button></div>
</form>
</div>
