<div class="modal-card popup-form">
  <div class="modal-header"><div><strong>Update Appointment</strong><p>View and update the appointment details and status.</p></div><button class="modal-close" data-close-popup>×</button></div>
  <form id="updateAppointmentForm"><div class="modal-body">
    <div class="modal-grid">
      <div class="field"><label>Appointment Date *</label><input name="date" type="date" required></div>
      <div class="field"><label>Appointment Time *</label><select name="time" required><option>09:00 AM</option><option>10:00 AM</option><option>10:30 AM</option><option>11:00 AM</option><option>01:00 PM</option><option>02:00 PM</option><option>03:00 PM</option></select></div>
      <div class="field"><label>Patient *</label><input name="patient" required></div>
      <div class="field"><label>Dentist *</label><select name="dentist" required><option>Dr. Angela M.</option><option>Dr. John D.</option></select></div>
      <div class="field"><label>Procedure *</label><select name="service" required><option>Cleaning</option><option>Dental Cleaning</option><option>Tooth Extraction</option><option>Consultation</option><option>Dental Filling</option><option>Braces Adjustment</option><option>Teeth Whitening</option></select></div>
      <div class="field"><label>Booking Type</label><input value="Online" disabled></div>
      <div class="field modal-full"><label>Appointment Status *</label><select name="status"><option>Scheduled</option><option>Pending</option><option>Confirmed</option><option>Completed</option><option>Cancelled</option></select></div>
    </div><p class="small-note">Update the status after the patient's appointment is handled.</p>
  </div><div class="modal-footer"><button type="button" class="btn btn-outline" data-close-popup>Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div></form>
</div>
