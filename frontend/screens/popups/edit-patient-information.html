<div class="modal-card popup-form">
  <div class="modal-header"><div><strong>Edit Patient Information</strong><p>Update the patient's personal and contact details.</p></div><button class="modal-close" data-close-popup>×</button></div>
  <form id="editPatientPopupForm"><div class="modal-body">
    <div class="patient-popup-head"><div class="mini-avatar" id="editPatientInitials">SR</div><div><strong id="editPatientDisplayName">Patient</strong><small>Patient profile</small></div></div>
    <div class="modal-grid">
      <div class="field"><label>Patient ID</label><input value="PSM-0001" disabled></div>
      <div class="field"><label>Full Name *</label><input name="name" required></div>
      <div class="field"><label>Birthday *</label><input name="birthday" type="date"></div>
      <div class="field"><label>Phone Number *</label><input name="phone" required></div>
      <div class="field modal-full"><label>Address *</label><input name="address" required></div>
      <div class="field"><label>Occupation</label><input name="occupation"></div>
      <div class="field"><label>Civil Status</label><select name="civilStatus"><option>Single</option><option>Married</option><option>Widowed</option><option>Prefer not to say</option></select></div>
    </div>
  </div><div class="modal-footer"><button type="button" class="btn btn-outline" data-close-popup>Cancel</button><button type="submit" class="btn btn-primary">Save Changes</button></div></form>
</div>
