<div class="modal-overlay" id="addDoctorModal">
  <div class="modal-card doctor-modal">

    <div class="modal-header">
      <div>
        <h2>Add New Doctor</h2>
        <p>Enter the doctor's information below.</p>
      </div>

      <button
        type="button"
        class="modal-close"
        id="closeAddDoctor"
      >&times;</button>
    </div>

    <form id="addDoctorForm">
      <div class="modal-body">
        <div class="field">
          <label for="doctorName">Doctor's Full Name</label>
          <input
            type="text"
            id="doctorName"
            name="doctorName"
            placeholder="e.g. Dr. Angela M."
            required
          />
        </div>
      </div>

      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-outline"
          id="cancelAddDoctor"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="btn btn-primary"
        >
          Save Doctor
        </button>
      </div>
    </form>

  </div>
</div>
