<div class="modal-card popup-small">
  <div class="modal-header">
    <strong data-popup-title>Booking confirmed</strong>
    <button class="modal-close" type="button" data-close-popup aria-label="Close confirmation">×</button>
  </div>
  <div class="modal-body">
    <div class="modal-symbol success">✓</div>
    <strong data-popup-message>Your appointment request has been submitted.</strong>
    <p id="bookingConfirmationDetails" class="confirmation-details"></p>
  </div>
  <div class="modal-footer">
    <button class="btn btn-primary" type="button" data-close-popup>Done</button>
  </div>
</div>
